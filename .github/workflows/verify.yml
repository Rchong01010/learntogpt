name: Verify

# PR verification gate: typecheck + security scan are blocking; lint is
# advisory until the pre-existing lint debt (66 errors as of 2026-07-17) is
# cleared, then flip continue-on-error off. Build verification is covered by
# the Vercel preview deploy on every PR.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      # --ignore-scripts: package lifecycle hooks (preinstall/install/postinstall)
      # are the execution vector for the Shai-Hulud worm family. ~/.npmrc sets
      # ignore-scripts=true on the dev host but that file never reaches a runner,
      # so CI was the last place a malicious hook could still execute. No package
      # in this lockfile needs its install script: esbuild, @swc/core,
      # unrs-resolver, sharp and @parcel/watcher all resolve prebuilt platform
      # binaries (@esbuild/linux-x64 etc.) from the lockfile at runtime, and
      # msw's postinstall no-ops without an `msw.workerDirectory` key.
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      # --ignore-scripts: see the typecheck job above for the full rationale.
      - run: npm ci --ignore-scripts
      - run: npm run lint

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install semgrep==1.154.0
      - run: semgrep scan --config p/security-audit --config p/secrets --severity ERROR --error
